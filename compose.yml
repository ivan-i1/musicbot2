# Runs on the home server from ~/services/musicbot2 (see README "Hosting").
# Outbound-only bot: no ports published.
name: musicbot2
services:
  bot:
    build: .
    image: musicbot2:local
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - data:/app/data
      # Local music library (only if MUSIC_DIR is set in .env, e.g. MUSIC_DIR=/music):
      # - /home/escalenus/music:/music:ro
    mem_limit: 512m

  # Local LLM for /chat (OpenAI-compatible API on llm:8080, compose network only).
  # The model file must be in ./models BEFORE `up` — see README "Hosting".
  # The bot does not depend_on this: it must keep running when llm is down.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b12199   # digest recorded in README at deploy
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpuset: "1,3"          # one physical core; core 0 stays free for ffmpeg + other services
    mem_limit: 2g
    memswap_limit: 2g
    volumes: ["./models:/models:ro"]
    command: >
      -m /models/Qwen_Qwen3.5-2B-Q4_K_M.gguf --alias chat --host 0.0.0.0 --port 8080
      --threads 2 --threads-batch 2 --parallel 1 --poll 0 --ctx-size 4096
      --cache-ram 256 --predict 256 --reasoning off --no-webui --metrics
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  data:
